name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'Documentation~/**'
      - 'Context~/TIFF_AGENT_COMMANDS.md'
      - 'src/Automation/**'
      - 'Tests~/AgentDocumentation.test.mjs'
      - 'Tests~/AgentCommandInventory.test.mjs'
      - '.github/workflows/documentation.yml'
      - 'README*.md'
      - 'package.json'
  pull_request:
    paths:
      - 'Documentation~/**'
      - 'Context~/TIFF_AGENT_COMMANDS.md'
      - 'src/Automation/**'
      - 'Tests~/AgentDocumentation.test.mjs'
      - 'Tests~/AgentCommandInventory.test.mjs'
      - '.github/workflows/documentation.yml'
      - 'README*.md'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Documentation~
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: Documentation~
      - name: Check documentation sources
        run: node scripts/check-docs.mjs source
      - name: Check agent documentation contracts
        run: |
          node ../Tests~/AgentDocumentation.test.mjs
          node ../Tests~/AgentCommandInventory.test.mjs
      - name: Check brush schema and examples
        run: node ../Tests~/BrushClipboard.test.mjs
      - name: Initialize theme search
        run: bundle exec just-the-docs rake search:init
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter --trace
        env:
          JEKYLL_ENV: production
      - name: Check generated pages and search index
        run: node scripts/check-docs.mjs site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: Documentation~/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
